name: CI

on:
  push:
    branches: [main, milestone-3-multitenant]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q app main.py
      - name: Tests
        env:
          RATE_LIMIT_ENABLED: "false"
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t aiscreenx-api ./backend
      - name: Build frontend image
        run: docker build -t aiscreenx-web ./frontend

  deploy:
    # Production deploy requires manual approval via the 'production'
    # environment protection rules configured in repository settings.
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy (placeholder — configure your target)
        run: |
          echo "Deploy to your platform here. Required order:"
          echo "1. run migrations: alembic upgrade head"
          echo "2. rollout api + worker"
          echo "3. smoke test /health"
      - name: Smoke test
        run: curl -fsS "${{ secrets.DEPLOY_URL }}/health" || echo "configure DEPLOY_URL secret"
