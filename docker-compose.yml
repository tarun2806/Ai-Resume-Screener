# AI ScreenX production-like stack: PostgreSQL + MinIO (S3) + ClamAV + API + worker + frontend.
# Required env (root .env, gitignored — see backend/.env.example):
#   POSTGRES_PASSWORD, JWT_SECRET, ALLOWED_ORIGINS,
#   MINIO_ROOT_USER, MINIO_ROOT_PASSWORD, S3_BUCKET,
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
#   ADMIN_EMAIL, ADMIN_PASSWORD (optional)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aiscreenx
      POSTGRES_USER: aiscreenx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiscreenx -d aiscreenx"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # S3-compatible object storage (Adobe s3mock — real S3 API; swap for
  # AWS S3 / MinIO / R2 in real deployments by changing S3_ENDPOINT_URL).
  s3:
    image: adobe/s3mock:latest
    environment:
      initialBuckets: ${S3_BUCKET:-resumes-private}
    ports:
      - "9090:9090"
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4
    environment:
      CLAMAV_NO_MILTERD: "true"
    volumes:
      - clamavdata:/var/lib/clamav
    restart: unless-stopped

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend-env
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://aiscreenx:${POSTGRES_PASSWORD}@db:5432/aiscreenx
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      STORAGE_BACKEND: s3
      S3_BUCKET: ${S3_BUCKET:-resumes-private}
      S3_ENDPOINT_URL: http://s3:9090
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-s3mock}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-s3mock}
      AWS_REGION: us-east-1
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_REQUIRED: "true"
      CLAMAV_TIMEOUT_SECONDS: "15"
      RESUME_RETENTION_DAYS: ${RESUME_RETENTION_DAYS:-365}
      WORKER_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started
    restart: "no"

  api:
    build: ./backend
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=5).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-env
      WORKER_ENABLED: "true"
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from datetime import timedelta;from app.db import SessionLocal,WorkerHeartbeat,utcnow;db=SessionLocal();ok=db.query(WorkerHeartbeat).filter(WorkerHeartbeat.last_tick_at>utcnow()-timedelta(seconds=90)).count()>0;db.close();raise SystemExit(0 if ok else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  clamavdata:
